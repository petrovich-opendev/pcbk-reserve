# Локальные тесты (tests/integration): поверх compose.yaml, проект pcbk-test.
# 8443 на машине разработчика занят — только 127.0.0.1:18443.
# Тестовые пути и пороги — в test.env, который пишет фикстура stack.
# gVisor на машине разработчика нет: у мест только runtime: runc, остальное — из compose.yaml.
x-runc: &runc
  runtime: runc

services:
  edge:
    ports: !override
      - "127.0.0.1:18443:8443"

  # опрос свежести чаще: строка историана меняется за секунды, а не за полминуты
  core:
    environment:
      FRESH_POLL_S: "5"

  # мишень проверок прокси: чужой для прокси контейнер — его inspect должен получать 403
  foreign:
    image: busybox:1.38.0
    pull_policy: never
    container_name: pcbk-test-foreign
    command: ["sleep", "infinity"]
    init: true
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  student-01: *runc
  student-02: *runc
  student-03: *runc
  student-04: *runc
  student-05: *runc
  student-06: *runc
  student-07: *runc
  student-08: *runc
  student-09: *runc
  student-10: *runc
