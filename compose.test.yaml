# Локальные тесты (tests/integration): поверх compose.yaml, проект pcbk-test.
# 8443 на машине разработчика занят — только 127.0.0.1:18443.
# Тестовые пути и пороги — в test.env, который пишет фикстура stack.
# gVisor на машине разработчика нет: у мест только runtime: runc, остальное — из compose.yaml.
x-runc: &runc
  runtime: runc

services:
  edge:
    ports: !override
      - "127.0.0.1:18443:8443"
    # статика — копия edge/static со сборкой чата во временном каталоге фикстуры (Д6а, А6): сборка тестов не пишет в
    # общее дерево. !override заменяет список целиком — прочие привязки повторены как в compose.yaml
    volumes: !override
      - type: bind
        source: ./edge/pcbk.conf.template
        target: /etc/nginx/templates/pcbk.conf.template
        read_only: true
      - type: bind
        source: ${PCBK_TEST_STATIC:?PCBK_TEST_STATIC не задан}
        target: /usr/share/nginx/pcbk
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TLS_DIR:?TLS_DIR не задан}
        target: /etc/nginx/tls
        read_only: true
        bind:
          create_host_path: false
      - {type: volume, source: pcbk-edge-temp, target: /var/lib/pcbk-edge}

  # опрос свежести и OpenRouter чаще: строки историана и LLM меняются за секунды, а не за минуты;
  # вместо OpenRouter — двойник (ключи стенда — его заглушки, настоящий ключ сюда не попадает);
  # общий бюджет — только в тестах (учение «бюджет стенда израсходован» в чате места, Д4б)
  core:
    environment:
      FRESH_POLL_S: "5"
      OPENROUTER_BASE_URL: http://fake-openrouter:8080/api/v1
      LLM_POLL_S: "5"
      LLM_TOTAL_USD: ${LLM_TOTAL_USD:-1000}

  # двойник OpenRouter (core/tests/fake_openrouter.py, только stdlib) в сети выхода рядом с core;
  # с хоста теста — http://172.31.250.84:8080 (ручки /_requests и др.). Адрес вне динамических .88/29.
  # Свой образ от закреплённой базы (core/tests/Dockerfile.fake): общий тег python:3.12-slim машины не трогается
  fake-openrouter:
    build: {context: ./core/tests, dockerfile: Dockerfile.fake}
    image: pcbk-test/fake-openrouter:d4a
    pull_policy: never
    container_name: pcbk-test-openrouter
    init: true                      # SIGTERM доходит до python: stop без 10 с ожидания
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      pcbk-egress: {ipv4_address: 172.31.250.84}

  # мишень проверок прокси: чужой для прокси контейнер — его inspect должен получать 403
  foreign:
    image: busybox:1.38.0
    pull_policy: never
    container_name: pcbk-test-foreign
    command: ["sleep", "infinity"]
    init: true
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  student-01: *runc
  student-02: *runc
  student-03: *runc
  student-04: *runc
  student-05: *runc
  student-06: *runc
  student-07: *runc
  student-08: *runc
  student-09: *runc
  student-10: *runc
