# Стенд: прокси входа, сторож и две копии прокси сокета (Д1), одиннадцать рабочих мест (Д2, Д15б —
# место 11, профиль students), серверный слой (Д3а, инструменты — Д3б, LLM-прокси — Д4а, в сетях мест — Д4б).
# Переменные — из .env выкладки (deploy/env.example).
# Сторонние образы — только по тегу из deploy/images.lock, без pull.
# Наружу публикуется только 8443 контейнера edge; docker.sock — только у sp-ro и sp-ctl;
# сеть выхода pcbk-egress — только у core.

# имя проекта не зависит от каталога: том журнала и метки те же; тесты задают -p pcbk-test
name: pcbk-reserve

# общее для одиннадцати мест. Только runsc: runc — лишь в compose.test.yaml.
# Профиль students: команды выкладки без имён служб места не поднимают — их создают
# create и будит серверный слой (с Д5) или администратор.
# Секции build нет: образ один на десять мест, собирается локально и едет docker save/load;
# :d7b (или :d8b) остаётся на сервере для отката Д9а (:d6a — для отката Д7б).
# healthcheck не задаётся: работает проверка образа (GET /agent и слово MCP: «200 mcp=connected»).
x-student: &student
  image: pcbk-reserve/student:d24
  pull_policy: never
  runtime: runsc
  profiles: [students]
  user: "10001:10001"
  init: true
  ipc: private
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:exec,mode=1777,size=256m"]
  # лимиты меняются только по замеру Д2: порог — память > 700 МиБ или потоки > 358
  mem_limit: 1g
  memswap_limit: 1g                      # swap = 0
  cpus: 1.0
  pids_limit: 512
  restart: unless-stopped
  stop_grace_period: 10s
  labels: {pcbk.role: student}

services:
  edge:
    image: nginx:1.30.5-alpine
    pull_policy: never
    container_name: pcbk-edge
    restart: unless-stopped
    read_only: true
    # пишет только мастер от root; режим явно, а не 1777 и не от каталога образа
    tmpfs:
      - /var/cache/nginx:mode=0755
      - /var/run:mode=0755
      - /etc/nginx/conf.d:mode=0755
    cap_drop: [ALL]
    # мастер от root: CHOWN — каталоги кэша, SETUID/SETGID — рабочие процессы от nginx
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    # worker_processes auto — по процессу на ядро; число задаётся только в nginx.conf образа,
    # поэтому предел на процессы: мастер + рабочие + проверка живости
    pids_limit: 64
    ports:
      - "8443:8443"
    volumes:
      - type: bind
        source: ./edge/pcbk.conf.template
        target: /etc/nginx/templates/pcbk.conf.template
        read_only: true
      - type: bind
        source: ./edge/static
        target: /usr/share/nginx/pcbk
        read_only: true
      # cert.pem и key.pem; без DAC_* мастер читает ключ, только если каталог 0755,
      # а ключ принадлежит root (на сервере 0600) или открыт на чтение (только тестовый)
      - type: bind
        source: ${TLS_DIR:?TLS_DIR не задан}
        target: /etc/nginx/tls
        read_only: true
        bind:
          create_host_path: false
      # временные файлы тел запросов и ответов core (Д5б) — на диске: tmpfs считался бы в mem_limit 64m, а ответ
      # core под /pcbk/api/oc/ — до 4 МиБ; каталоги proxy/ и client/ создаёт мастер nginx (proxy_temp_path)
      - {type: volume, source: pcbk-edge-temp, target: /var/lib/pcbk-edge}
    # журнал с поворотом (итоговая доводка Д5б): отказы limit_req и limit_conn пишутся строкой на каждый запрос —
    # поток отказов одной cookie не растит диск сервера без предела
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    networks: [pcbk-public, pcbk-front]
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "2", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  watchdog:
    build: ./watchdog
    # откатный образ — `watchdog:d10a` (Д11а, А0)
    image: pcbk-reserve/watchdog:d15b
    # свой образ: без never compose сперва ищет это имя на Docker Hub
    pull_policy: never
    container_name: pcbk-watchdog
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    environment:
      # порт и пути связаны с edge и томами ниже — не настраиваются
      LISTEN_PORT: "8090"
      DOCKER_URL: http://pcbk-sp-ro:2375
      TLS_CAFILE: /app/tls/cert.pem
      JOURNAL_PATH: /var/lib/pcbk-watchdog/journal.db
      MEMINFO_PATH: /proc/meminfo
      # «Память сервера» (Д11): счётчик убийств по памяти oom_kill и давление памяти; под runc — значения хоста
      VMSTAT_PATH: /proc/vmstat
      PRESSURE_PATH: /proc/pressure/memory
      COMPONENTS_PATH: /app/components.json
      # настраиваются из .env или оболочки (учения меняют TICK_S и MEM_WARN_MIB)
      TICK_S: ${TICK_S:-10}
      STALE_AFTER_S: ${STALE_AFTER_S:-30}
      DOCKER_TIMEOUT_S: ${DOCKER_TIMEOUT_S:-3}
      DISPLAY_TZ: ${DISPLAY_TZ:-UTC}
      MEM_WARN_MIB: ${MEM_WARN_MIB:-2048}
      MEM_FAIL_MIB: ${MEM_FAIL_MIB:-1024}
      # «Память сервера» (Д11): swap вырос за 10 мин на SWAP_GROW_WARN_MIB, МиБ, — «вытесняет память в swap»;
      # давление full avg10 выше PSI_FULL_MAX, %, 3 такта подряд — «давление выше порога» (В1 правит оба по базе)
      SWAP_GROW_WARN_MIB: ${SWAP_GROW_WARN_MIB:-512}
      PSI_FULL_MAX: ${PSI_FULL_MAX:-10}
      # учения «цикл молчит при живом HTTP»: 1 — цикл замирает после первого такта
      DRILL_FREEZE_LOOP: ${DRILL_FREEZE_LOOP:-0}
      # свежесть историана (Д3а): возраст метки — «внимание» / «сбой»; опрос службы данных
      # старше HIST_STALE_S — «неизвестно» (формула — задача 1 Д3а, шаг 5; учения меняют HIST_*)
      HIST_WARN_S: ${HIST_WARN_S:-300}
      HIST_FAIL_S: ${HIST_FAIL_S:-900}
      HIST_STALE_S: ${HIST_STALE_S:-140}
      # строка «Шлюз и вход» (Д5а): метка такта уборщика старше GW_STALE_S — «уборщик простоя молчит»;
      # не меньше 4 × GW_REAPER_TICK_S у core
      GW_STALE_S: ${GW_STALE_S:-120}
      # строка «Агенты студентов» (Д7а): метка прохода воркера перезагрузки агентов старше AGENTS_STALE_S —
      # «перезагрузка агентов молчит»; воркер ставит её раз в 2 с и перед каждым местом прохода
      AGENTS_STALE_S: ${AGENTS_STALE_S:-60}
      # строка «LLM-прокси и бюджет» (Д8а): к модели прогона отбора не обращались дольше LLM_RUN_SILENT_S —
      # «прогон отбора молчит»; учения тишины ставят меньше
      LLM_RUN_SILENT_S: ${LLM_RUN_SILENT_S:-300}
      # строка «Кабинет преподавателя и доли» (Д10а): сверка долей (такт уборщика шлюза) старше TEACHER_STALE_S —
      # «сверка долей молчит»; не меньше 4 × GW_REAPER_TICK_S у core
      TEACHER_STALE_S: ${TEACHER_STALE_S:-120}
    volumes:
      # только сертификат: им сторож проверяет, что edge отдаёт именно его
      - type: bind
        source: ${TLS_DIR:?TLS_DIR не задан}/cert.pem
        target: /app/tls/cert.pem
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: pcbk-watchdog-journal
        target: /var/lib/pcbk-watchdog
    networks: [pcbk-front, pcbk-ro]

  # Прокси сокета Docker. Права — флагами ниже, прокси сам дописывает ^…$ (альтернативы — в скобках);
  # метод без списка → 405, путь вне списка → 403, клиент не из -allowfrom → 403.
  # Списка контейнеров нет ни у кого: GET /containers/json отдаёт все контейнеры сервера
  # с Command (у Dify там пароли), а строку запроса с фильтром прокси не проверяет.
  # :ro на сокете от записи в Docker не защищает — защищает только фильтр.

  # сторожу — только чтение: ping и inspect рабочих мест, sp-ctl и core (Д4б: строка контейнера core)
  sp-ro:
    image: wollomatic/socket-proxy:1.13.1
    pull_policy: never
    container_name: pcbk-sp-ro
    restart: unless-stopped
    # пользователь образа; группа docker — доступ к сокету
    user: "65534:${DOCKER_GID:?DOCKER_GID не задан}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 32m
    command:
      - '-listenip=0.0.0.0'
      - '-allowfrom=pcbk-watchdog'
      - '-allowGET=(/v1\.[0-9]+)?/(_ping|containers/pcbk-(student-(0[1-9]|1[01])|sp-ctl|core)/json)'
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
    networks: [pcbk-ro]

  # серверному слою (шлюзу, Д5а) — inspect, start и stop только рабочих мест
  sp-ctl:
    image: wollomatic/socket-proxy:1.13.1
    pull_policy: never
    container_name: pcbk-sp-ctl
    restart: unless-stopped
    user: "65534:${DOCKER_GID:?DOCKER_GID не задан}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 32m
    command:
      - '-listenip=0.0.0.0'
      - '-allowfrom=pcbk-core'
      - '-allowGET=(/v1\.[0-9]+)?/(_ping|containers/pcbk-student-(0[1-9]|1[01])/json)'
      - '-allowPOST=(/v1\.[0-9]+)?/containers/pcbk-student-(0[1-9]|1[01])/(start|stop)'
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
    networks: [pcbk-ctl]

  # Серверный слой: роль «данные» (Д3а) — каталог тегов и свежесть историана, инструменты по
  # токену и журнал событий (Д3б); роль llm (Д4а) — прокси к OpenRouter с бюджетом и журналом вызовов;
  # роль gateway (Д5а) — вход студентов и их места через sp-ctl (pcbk-ctl, Д5-R31).
  # Учётные данные историана, ключи OpenRouter, хеши токенов и пароли мест — только файлами-секретами,
  # белый список — файлом только для чтения. В сеть выхода pcbk-egress — только он (Д3а-R2); в сети мест —
  # на .2 (Д4б-R23: места ходят к /llm и /mcp по имени core из extra_hosts). Ручки шлюза отвечают только
  # на адресе core в pcbk-front (Д5-R31). Порт 8000 не публикуется.
  core:
    build: ./core
    # откатный образ — `core:d10b` (Д11а, А0; deploy/README.md, «Откат»)
    image: pcbk-reserve/core:d24
    pull_policy: never              # свой образ: без never compose ищет имя на Docker Hub
    container_name: pcbk-core
    user: "10003:10003"
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m                 # тела запросов к модели — до 1 МиБ, разбор JSON от одиннадцати мест
    pids_limit: 128
    # TCP Fast Open выключен (Д3б-R6): TCP не уйдёт мимо connect, который проверяет охрана выхода в процессе.
    # Пересылка выключена (Д4б-R23): core в тринадцати сетях не мост между местами и к сети выхода — второй
    # слой; первый — у места нет маршрута по умолчанию (Д2). По умолчанию netns контейнера наследует 1 хоста
    sysctls: {net.ipv4.tcp_fastopen: "0", net.ipv4.ip_forward: "0"}
    restart: unless-stopped
    # мягкая остановка uvicorn — 2 с, затем роль шлюза закрывает открытые потоки /event (все вместе — не дольше
    # 3 с) и lifespan журнала LLM дописывает очередь; 20 с — с запасом до SIGKILL (Д5б)
    stop_grace_period: 20s
    environment:                    # только несекретное
      CORE_PORT: "8000"
      FRESH_POLL_S: ${FRESH_POLL_S:-30}
      CATALOG_DEADLINE_S: ${CATALOG_DEADLINE_S:-60}
      # учения свежести: freeze_stamps — метки не растут, freeze_poll — опрос встаёт; пусто — нет
      DRILL_FRESHNESS: ${DRILL_FRESHNESS:-}
      # учения службы данных (Д9а): tool_error — инструменты чтения отвечают ошибкой без SQL и без данных
      # историана (выкладка без окна владельца); пусто — нет
      DRILL_DATA: ${DRILL_DATA:-}
      # LLM-прокси (Д4а): список моделей (пусто — все семь), выключатель (stopped), учения
      # «кончились деньги» (402) без OpenRouter, доля администратора, $; ключ только у резервного
      # контура (on — сверка расхода с /key; off — ключ общий, сверки нет)
      LLM_MODELS: ${LLM_MODELS:-}
      # запасная модель при отказе основной «подождите/недоступен» до первого байта (Д14): пусто — повтора нет,
      # иначе пары <основная>=<запасная> через запятую, имена — точные имена CANDIDATES (llm/models.py)
      LLM_FALLBACK: ${LLM_FALLBACK:-}
      LLM_STATE: ${LLM_STATE:-on}
      DRILL_LLM: ${DRILL_LLM:-}
      LLM_OPS_SHARE_USD: ${LLM_OPS_SHARE_USD:-100}
      LLM_KEY_DEDICATED: ${LLM_KEY_DEDICATED:-on}
      # общий бюджет LLM-прокси, $ (Д15б): пусто — умолчание кода 1000; на сервере ПЦБК — 1100
      # (одиннадцать мест по $100, Ruling 3)
      LLM_TOTAL_USD: ${LLM_TOTAL_USD:-}
      # прогон отбора модели (Д8-R69): id, потолок, $, и места прогона через запятую — все три или ни одного;
      # пусто — прогона нет. Задаются только на время прогона, потолок — поверх долей и общего бюджета
      LLM_RUN_ID: ${LLM_RUN_ID:-}
      LLM_RUN_USD: ${LLM_RUN_USD:-}
      LLM_RUN_CALLERS: ${LLM_RUN_CALLERS:-}
      # тормоз прогона (Д11): только при LLM_RUN_* core сам раз в 5 с читает /proc хоста и под защёлкой отказывает
      # вызовам мест прогона и усыпляет их; пороги — свои, иначе пороги сторожа (MEM_FAIL_MIB, SWAP_GROW_WARN_MIB,
      # PSI_FULL_MAX); база swap −1 — от первой проверки прогона. Пути к /proc здесь не задаются (двойники — compose.test.yaml)
      LLM_RUN_MEM_FAIL_MIB: ${LLM_RUN_MEM_FAIL_MIB:-${MEM_FAIL_MIB:-1024}}
      LLM_RUN_SWAP_GROW_MIB: ${LLM_RUN_SWAP_GROW_MIB:-${SWAP_GROW_WARN_MIB:-512}}
      LLM_RUN_SWAP_BASE_MIB: ${LLM_RUN_SWAP_BASE_MIB:--1}
      LLM_RUN_PSI_FULL_MAX: ${LLM_RUN_PSI_FULL_MAX:-${PSI_FULL_MAX:-10}}
      # шлюз (Д5а). STU_NET — те же сети мест, что ниже: по нему core сверяет токен места с его сетью
      # (Ш25) и зовёт место на STU.N.3; без него при нестандартной подсети отказ получило бы каждое место
      STU_NET: ${STU_NET:-172.31}
      # публичный origin страницы входа https://<имя сертификата>:8443; пусто — запись проходит только
      # с Sec-Fetch-Site: same-origin (его шлёт браузер), по Origin — никогда
      GW_ORIGIN: ${GW_ORIGIN:-}
      # простой места до сна и такт уборщика, с (такт — не больше половины простоя)
      GW_IDLE_STOP_S: ${GW_IDLE_STOP_S:-1800}
      GW_REAPER_TICK_S: ${GW_REAPER_TICK_S:-30}
      # учения: freeze_reaper — уборщик замирает после первого такта, bad_place_pw — шлюз портит пароль
      # места; пусто — нет
      DRILL_GATEWAY: ${DRILL_GATEWAY:-}
      # учения агентов студентов (Д7а): freeze_reload — воркер перезагрузки мест замирает после первого
      # прохода; пусто — нет
      DRILL_AGENTS: ${DRILL_AGENTS:-}
      # учения кабинета преподавателя (Д10а): shares_stale — перевод доли пишет диск и журнал действий, а память
      # LLM-прокси не обновляет; journal_down — журнал действий не пишется (кабинет закрыт); пусто — нет. Опечатка —
      # ошибка настройки шлюза и закрытый LLM-прокси, процесс жив
      DRILL_TEACHER: ${DRILL_TEACHER:-}
      # аналитический чат технолога КДМ-1 (Task 9; мастер-промпт §4, §10): core получает только настройки из
      # analytics/settings.py — выключатель по умолчанию пуст (аналитика выключена, старый .env без ANALYTICS_*
      # поднимается как раньше). ANALYTICS_CORPUS_DIR/ANALYTICS_STATE_PATH здесь НЕ передаются: путь внутри
      # контейнера фиксирован умолчанием settings.py (/srv/analytics — ровно том ниже; /var/lib/pcbk-core/
      # analytics.db — уже существующий том core-data) — как LESSONS_ROOT/LESSONS_DIR: хост задаёт каталог
      # хоста монтирования (ниже, volumes), контейнерный путь не параметр
      ANALYTICS_ENABLED: ${ANALYTICS_ENABLED:-}
      ANALYTICS_LLM_MODELS: ${ANALYTICS_LLM_MODELS:-}
      ANALYTICS_LLM_EXPORT_POLICY: ${ANALYTICS_LLM_EXPORT_POLICY:-}
      # кто решает заявки согласования reviews/* (F5, решение владельца 14.10.2026) — grants | all_students;
      # пусто — умолчание кода grants (docs/kdm1/REVIEWS_OPERATIONS.md, раздел «Режим ANALYTICS_REVIEWERS»)
      ANALYTICS_REVIEWERS: ${ANALYTICS_REVIEWERS:-}
      ANALYTICS_TEACHER_PAYER: ${ANALYTICS_TEACHER_PAYER:-}
      ANALYTICS_HISTORY_RETENTION_DAYS: ${ANALYTICS_HISTORY_RETENTION_DAYS:-}
      ANALYTICS_EVIDENCE_RETENTION_DAYS: ${ANALYTICS_EVIDENCE_RETENTION_DAYS:-}
      ANALYTICS_JOB_TIMEOUT_S: ${ANALYTICS_JOB_TIMEOUT_S:-}
    volumes:
      - {type: bind, source: "${DATA_DIR:?DATA_DIR не задан}/whitelist.txt", target: /app/data/whitelist.txt,
         read_only: true, bind: {create_host_path: false}}
      # каталог агентов студентов (Д7-R55): core пишет файлы агентов мест (save_agent), карантин и архив; место
      # монтирует только свой student-NN и только на чтение. Владелец — 10003, корень 0700, каталоги мест 0755
      - {type: bind, source: "${AGENTS_DIR:?AGENTS_DIR не задан}", target: /srv/agents,
         bind: {create_host_path: false}}
      # пакет уроков вкладки «Уроки» (Д15а): только на чтение, как сам каталог у LESSONS_ROOT core (lessons.py)
      # не пишет; обязателен, как AGENTS_DIR — каталога нет, а не пустой урок (Ruling 3)
      - {type: bind, source: "${LESSONS_DIR:?LESSONS_DIR не задан}", target: /srv/lessons,
         read_only: true, bind: {create_host_path: false}}
      # корпус аналитики КДМ-1 (Task 9; мастер-промпт §4, §10): только на чтение, как LESSONS_DIR — но НЕ
      # обязателен («:?»), в отличие от LESSONS_DIR/AGENTS_DIR/DATA_DIR: аналитика выключена по умолчанию
      # (ANALYTICS_ENABLED пуст), и старый .env без ANALYTICS_CORPUS_DIR не должен падать на docker compose —
      # умолчание — пустой именованный том pcbk-analytics-empty (короткая запись: путь — привязка каталога
      # хоста, имя — том), а не каталог репозитория: на сервере есть только compose.yaml и edge/. На сервере
      # ПЦБК ANALYTICS_CORPUS_DIR указывает на настоящий корпус (вне git, версии — docs/kdm1/CORPUS_OPERATIONS.md)
      - "${ANALYTICS_CORPUS_DIR:-pcbk-analytics-empty}:/srv/analytics:ro"
      # журнал событий core.db; каталог образа принадлежит 10003 — том наследует владельца
      - {type: volume, source: pcbk-core-data, target: /var/lib/pcbk-core}
    secrets:
      - {source: bdrv-env, target: bdrv.env}
      - {source: core-tokens, target: core-tokens}
      - {source: llm-tokens, target: llm-tokens}
      - {source: openrouter-key, target: openrouter.key}
      - {source: openrouter-mgmt-key, target: openrouter-mgmt.key}
      # пароли мест знает только шлюз (Д5а): Authorization к месту ставит он; новый файл —
      # up -d --no-build --force-recreate core
      - {source: student-01-pw, target: student-01.pw}
      - {source: student-02-pw, target: student-02.pw}
      - {source: student-03-pw, target: student-03.pw}
      - {source: student-04-pw, target: student-04.pw}
      - {source: student-05-pw, target: student-05.pw}
      - {source: student-06-pw, target: student-06.pw}
      - {source: student-07-pw, target: student-07.pw}
      - {source: student-08-pw, target: student-08.pw}
      - {source: student-09-pw, target: student-09.pw}
      - {source: student-10-pw, target: student-10.pw}
      - {source: student-11-pw, target: student-11.pw}
    # журнал с поворотом: строки шлюза и отказов пишутся на каждый вход — диск сервера не растёт без предела
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    networks:
      pcbk-front: {}
      pcbk-egress: {ipv4_address: 172.31.250.82}
      # клиент sp-ctl (Д5-R31): -allowfrom=pcbk-core разрешает имя в этой сети
      pcbk-ctl: {}
      # сети мест: адрес .2 — тот, что у мест в extra_hosts (core:STU.N.2)
      pcbk-stu-01: {ipv4_address: "${STU_NET:-172.31}.1.2"}
      pcbk-stu-02: {ipv4_address: "${STU_NET:-172.31}.2.2"}
      pcbk-stu-03: {ipv4_address: "${STU_NET:-172.31}.3.2"}
      pcbk-stu-04: {ipv4_address: "${STU_NET:-172.31}.4.2"}
      pcbk-stu-05: {ipv4_address: "${STU_NET:-172.31}.5.2"}
