# пароль сервера OpenCode, токены LLM и данных мест — только файлами (в Config.Env их нет);
# 48 шестнадцатеричных знаков без перевода строки, порождаются на сервере и не перезаписываются
secrets:
  # учётные данные историана (BDRV_*): копия файла Dify, install -m 0444 в SECRETS_DIR (0700)
  bdrv-env: {file: "${SECRETS_DIR:?SECRETS_DIR не задан}/bdrv.env"}
  # хеши токенов вызывающих службы данных: строки «<id> <sha256>», файл 0444 — ops и десять мест; сами
  # токены <id>.data-token (48 шестнадцатеричных знаков) — только на сервере; токены мест (0444) — ещё и
  # секретами мест (Д4б). Новый core-tokens — up -d --no-build --force-recreate core
  core-tokens: {file: "${SECRETS_DIR:?SECRETS_DIR не задан}/core-tokens"}
  # LLM-прокси (Д4а): хеши токенов LLM мест и ops (формат core-tokens, файл 0444) — отдельная таблица;
  # ключи OpenRouter (0444, кладёт владелец): основной и управления (пустой файл — «ключа нет»).
  # Файл 0444 не перезаписывается: rm -f, запись, docker compose up -d --no-build --force-recreate core
  llm-tokens: {file: "${SECRETS_DIR:?SECRETS_DIR не задан}/llm-tokens"}
  openrouter-key: {file: "${SECRETS_DIR:?SECRETS_DIR не задан}/openrouter.key"}
  openrouter-mgmt-key: {file: "${SECRETS_DIR:?SECRETS_DIR не задан}/openrouter-mgmt.key"}
  student-01-pw: {file: "${SECRETS_DIR:?SECRETS_DIR не задан}/student-01.pw"}
  student-01-llm: {file: "${SECRETS_DIR:?SECRETS_DIR не задан}/student-01.llm-token"}
  student-01-data: {file: "${SECRETS_DIR:?SECRETS_DIR не задан}/student-01.data-token"}
