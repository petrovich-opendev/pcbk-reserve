networks:
  # только edge — ради публикации 8443; без маскарада: наружу edge не ходит
  pcbk-public:
    name: pcbk-public
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        - subnet: 172.31.250.16/28
  # edge, сторож и серверный слой; без адреса хоста на мосту — службы хоста отсюда не видны
  pcbk-front:
    name: pcbk-front
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    ipam:
      config:
        - subnet: 172.31.250.32/28
  # сторож и sp-ro
  pcbk-ro:
    name: pcbk-ro
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    ipam:
      config:
        - subnet: 172.31.250.48/28
  # sp-ctl и серверный слой — его клиент (Д5а)
  pcbk-ctl:
    name: pcbk-ctl
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    ipam:
      config:
        - subnet: 172.31.250.64/28
  # выход серверного слоя к историану (Д3а-R2) и OpenRouter (Д4а): только core на .82,
  # динамические адреса — только .88/29; маскарад включён. На уровне сети отсюда открыт любой
  # адрес, включая сервер через шлюз моста (.81): направления держит охрана выхода в процессе
  # (Д3б-R6) — остаточный риск до сетевого экрана (Д12)
  pcbk-egress:
    name: pcbk-egress
    driver: bridge
    # имя моста на хосте постоянное и при пересоздании сети — под будущие правила сетевого экрана
    driver_opts: {com.docker.network.bridge.name: pcbk-egress}
    ipam: {config: [{subnet: 172.31.250.80/28, ip_range: 172.31.250.88/29}]}
  # сети мест: у каждого своя; динамические адреса — только из .8/29
  pcbk-stu-01:
    name: pcbk-stu-01
    driver: bridge
    internal: true
    driver_opts: {com.docker.network.bridge.gateway_mode_ipv4: isolated}
    ipam: {config: [{subnet: "${STU_NET:-172.31}.1.0/28", ip_range: "${STU_NET:-172.31}.1.8/29"}]}
  pcbk-stu-02:
    name: pcbk-stu-02
    driver: bridge
    internal: true
    driver_opts: {com.docker.network.bridge.gateway_mode_ipv4: isolated}
    ipam: {config: [{subnet: "${STU_NET:-172.31}.2.0/28", ip_range: "${STU_NET:-172.31}.2.8/29"}]}
  pcbk-stu-03:
    name: pcbk-stu-03
    driver: bridge
    internal: true
    driver_opts: {com.docker.network.bridge.gateway_mode_ipv4: isolated}
    ipam: {config: [{subnet: "${STU_NET:-172.31}.3.0/28", ip_range: "${STU_NET:-172.31}.3.8/29"}]}
  pcbk-stu-04:
    name: pcbk-stu-04
    driver: bridge
    internal: true
    driver_opts: {com.docker.network.bridge.gateway_mode_ipv4: isolated}
    ipam: {config: [{subnet: "${STU_NET:-172.31}.4.0/28", ip_range: "${STU_NET:-172.31}.4.8/29"}]}
  pcbk-stu-05:
    name: pcbk-stu-05
