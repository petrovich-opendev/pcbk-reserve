      - pcbk-student-08-work:/work
      - {type: bind, source: "${AGENTS_DIR:?AGENTS_DIR не задан}/student-08", target: /etc/pcbk-opencode/opencode/agents,
         read_only: true, bind: {create_host_path: false}}
    secrets:
