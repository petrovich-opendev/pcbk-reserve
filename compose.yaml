  student-08:
    <<: *student
    container_name: pcbk-student-08
    networks: {pcbk-stu-08: {ipv4_address: "${STU_NET:-172.31}.8.3"}}
    extra_hosts: ["core:${STU_NET:-172.31}.8.2"]
    volumes:
