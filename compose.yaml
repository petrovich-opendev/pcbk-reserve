# Стенд: прокси входа, сторож и две копии прокси сокета (Д1), десять рабочих мест (Д2,
# профиль students), серверный слой (Д3а). Переменные — из .env выкладки (deploy/env.example).
# Сторонние образы — только по тегу из deploy/images.lock, без pull.
# Наружу публикуется только 8443 контейнера edge; docker.sock — только у sp-ro и sp-ctl;
# сеть выхода pcbk-egress — только у core.

# имя проекта не зависит от каталога: том журнала и метки те же; тесты задают -p pcbk-test
name: pcbk-reserve

# общее для десяти мест. Только runsc: runc — лишь в compose.test.yaml.
# Профиль students: команды выкладки без имён служб места не поднимают — их создают
# create и будит серверный слой (с Д5) или администратор.
# Секции build нет: образ один на десять мест, собирается локально и едет docker save/load.
# healthcheck не задаётся: работает проверка образа (GET /agent, печатает только код).
x-student: &student
  image: pcbk-reserve/student:d2
  pull_policy: never
  runtime: runsc
  profiles: [students]
  user: "10001:10001"
  init: true
  ipc: private
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:exec,mode=1777,size=256m"]
  # лимиты меняются только по замеру Д2: порог — память > 700 МиБ или потоки > 358
  mem_limit: 1g
  memswap_limit: 1g                      # swap = 0
  cpus: 1.0
  pids_limit: 512
  restart: unless-stopped
  stop_grace_period: 10s
  labels: {pcbk.role: student}

services:
  edge:
    image: nginx:1.30.5-alpine
    pull_policy: never
    container_name: pcbk-edge
    restart: unless-stopped
    read_only: true
    # пишет только мастер от root; режим явно, а не 1777 и не от каталога образа
    tmpfs:
      - /var/cache/nginx:mode=0755
      - /var/run:mode=0755
      - /etc/nginx/conf.d:mode=0755
    cap_drop: [ALL]
    # мастер от root: CHOWN — каталоги кэша, SETUID/SETGID — рабочие процессы от nginx
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    # worker_processes auto — по процессу на ядро; число задаётся только в nginx.conf образа,
    # поэтому предел на процессы: мастер + рабочие + проверка живости
    pids_limit: 64
    ports:
      - "8443:8443"
    volumes:
      - type: bind
        source: ./edge/pcbk.conf.template
        target: /etc/nginx/templates/pcbk.conf.template
        read_only: true
      - type: bind
        source: ./edge/static
        target: /usr/share/nginx/pcbk
        read_only: true
      # cert.pem и key.pem; без DAC_* мастер читает ключ, только если каталог 0755,
      # а ключ принадлежит root (на сервере 0600) или открыт на чтение (только тестовый)
      - type: bind
        source: ${TLS_DIR:?TLS_DIR не задан}
        target: /etc/nginx/tls
        read_only: true
        bind:
          create_host_path: false
    networks: [pcbk-public, pcbk-front]
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "2", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  watchdog:
    build: ./watchdog
    # :d2 остаётся на сервере для отката
    image: pcbk-reserve/watchdog:d3a
    # свой образ: без never compose сперва ищет это имя на Docker Hub
    pull_policy: never
    container_name: pcbk-watchdog
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    environment:
      # порт и пути связаны с edge и томами ниже — не настраиваются
      LISTEN_PORT: "8090"
      DOCKER_URL: http://pcbk-sp-ro:2375
      TLS_CAFILE: /app/tls/cert.pem
      JOURNAL_PATH: /var/lib/pcbk-watchdog/journal.db
      MEMINFO_PATH: /proc/meminfo
      COMPONENTS_PATH: /app/components.json
      # настраиваются из .env или оболочки (учения меняют TICK_S и MEM_WARN_MIB)
      TICK_S: ${TICK_S:-10}
      STALE_AFTER_S: ${STALE_AFTER_S:-30}
      DOCKER_TIMEOUT_S: ${DOCKER_TIMEOUT_S:-3}
      DISPLAY_TZ: ${DISPLAY_TZ:-UTC}
      MEM_WARN_MIB: ${MEM_WARN_MIB:-2048}
      MEM_FAIL_MIB: ${MEM_FAIL_MIB:-1024}
      # учения «цикл молчит при живом HTTP»: 1 — цикл замирает после первого такта
      DRILL_FREEZE_LOOP: ${DRILL_FREEZE_LOOP:-0}
      # свежесть историана (Д3а): возраст метки — «внимание» / «сбой»; опрос службы данных
      # старше HIST_STALE_S — «неизвестно» (формула — задача 1 Д3а, шаг 5; учения меняют HIST_*)
      HIST_WARN_S: ${HIST_WARN_S:-300}
      HIST_FAIL_S: ${HIST_FAIL_S:-900}
      HIST_STALE_S: ${HIST_STALE_S:-140}
    volumes:
      # только сертификат: им сторож проверяет, что edge отдаёт именно его
      - type: bind
        source: ${TLS_DIR:?TLS_DIR не задан}/cert.pem
        target: /app/tls/cert.pem
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: pcbk-watchdog-journal
        target: /var/lib/pcbk-watchdog
    networks: [pcbk-front, pcbk-ro]

  # Прокси сокета Docker. Права — флагами ниже, прокси сам дописывает ^…$ (альтернативы — в скобках);
  # метод без списка → 405, путь вне списка → 403, клиент не из -allowfrom → 403.
  # Списка контейнеров нет ни у кого: GET /containers/json отдаёт все контейнеры сервера
  # с Command (у Dify там пароли), а строку запроса с фильтром прокси не проверяет.
  # :ro на сокете от записи в Docker не защищает — защищает только фильтр.

  # сторожу — только чтение: ping и inspect рабочих мест и sp-ctl
  sp-ro:
    image: wollomatic/socket-proxy:1.13.1
    pull_policy: never
    container_name: pcbk-sp-ro
    restart: unless-stopped
    # пользователь образа; группа docker — доступ к сокету
    user: "65534:${DOCKER_GID:?DOCKER_GID не задан}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 32m
    command:
      - '-listenip=0.0.0.0'
      - '-allowfrom=pcbk-watchdog'
      - '-allowGET=(/v1\.[0-9]+)?/(_ping|containers/pcbk-(student-(0[1-9]|10)|sp-ctl)/json)'
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
    networks: [pcbk-ro]

  # серверному слою (с Д5) — inspect, start и stop только рабочих мест
  sp-ctl:
    image: wollomatic/socket-proxy:1.13.1
    pull_policy: never
    container_name: pcbk-sp-ctl
    restart: unless-stopped
    user: "65534:${DOCKER_GID:?DOCKER_GID не задан}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 32m
    command:
      - '-listenip=0.0.0.0'
      - '-allowfrom=pcbk-core'
      - '-allowGET=(/v1\.[0-9]+)?/(_ping|containers/pcbk-student-(0[1-9]|10)/json)'
      - '-allowPOST=(/v1\.[0-9]+)?/containers/pcbk-student-(0[1-9]|10)/(start|stop)'
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
    networks: [pcbk-ctl]

  # Серверный слой: роль «данные» (Д3а) — каталог тегов и свежесть историана. Учётные данные
  # историана — только файлом-секретом, белый список — файлом только для чтения. В сеть выхода
  # pcbk-egress — только он (Д3а-R2); сети мест и pcbk-ctl — с Д4 и Д5. Порт 8000 не публикуется.
  core:
    build: ./core
    image: pcbk-reserve/core:d3a
    pull_policy: never              # свой образ: без never compose ищет имя на Docker Hub
    container_name: pcbk-core
    user: "10003:10003"
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 128
    restart: unless-stopped
    environment:                    # только несекретное
      CORE_PORT: "8000"
      FRESH_POLL_S: ${FRESH_POLL_S:-30}
      CATALOG_DEADLINE_S: ${CATALOG_DEADLINE_S:-60}
      # учения свежести: freeze_stamps — метки не растут, freeze_poll — опрос встаёт; пусто — нет
      DRILL_FRESHNESS: ${DRILL_FRESHNESS:-}
    volumes:
      - {type: bind, source: "${DATA_DIR:?DATA_DIR не задан}/whitelist.txt", target: /app/data/whitelist.txt,
         read_only: true, bind: {create_host_path: false}}
    secrets: [{source: bdrv-env, target: bdrv.env}]
    networks:
      pcbk-front: {}
      pcbk-egress: {ipv4_address: 172.31.250.82}

  # Рабочие места 01…10: только своя сеть (место .3, серверный слой .2 через extra_hosts —
  # под gVisor DNS Docker не работает), свои тома, агенты и секреты; портов нет.
  # Блоки 02–10 — копия 01 с точностью до номера (тест test_student_hardening).
  student-01:
    <<: *student
    container_name: pcbk-student-01
    networks: {pcbk-stu-01: {ipv4_address: "${STU_NET:-172.31}.1.3"}}
    extra_hosts: ["core:${STU_NET:-172.31}.1.2"]
    volumes:
      - pcbk-student-01-state:/var/lib/opencode
      - pcbk-student-01-work:/work
      - {type: bind, source: "${AGENTS_DIR:?AGENTS_DIR не задан}/student-01", target: /etc/pcbk-opencode/opencode/agents,
         read_only: true, bind: {create_host_path: false}}
    secrets:
      - {source: student-01-pw, target: opencode-pw}
      - {source: student-01-llm, target: llm-token}

  student-02:
    <<: *student
    container_name: pcbk-student-02
    networks: {pcbk-stu-02: {ipv4_address: "${STU_NET:-172.31}.2.3"}}
    extra_hosts: ["core:${STU_NET:-172.31}.2.2"]
    volumes:
      - pcbk-student-02-state:/var/lib/opencode
      - pcbk-student-02-work:/work
      - {type: bind, source: "${AGENTS_DIR:?AGENTS_DIR не задан}/student-02", target: /etc/pcbk-opencode/opencode/agents,
         read_only: true, bind: {create_host_path: false}}
    secrets:
      - {source: student-02-pw, target: opencode-pw}
      - {source: student-02-llm, target: llm-token}

  student-03:
    <<: *student
    container_name: pcbk-student-03
    networks: {pcbk-stu-03: {ipv4_address: "${STU_NET:-172.31}.3.3"}}
    extra_hosts: ["core:${STU_NET:-172.31}.3.2"]
    volumes:
      - pcbk-student-03-state:/var/lib/opencode
      - pcbk-student-03-work:/work
      - {type: bind, source: "${AGENTS_DIR:?AGENTS_DIR не задан}/student-03", target: /etc/pcbk-opencode/opencode/agents,
         read_only: true, bind: {create_host_path: false}}
    secrets:
      - {source: student-03-pw, target: opencode-pw}
      - {source: student-03-llm, target: llm-token}

  student-04:
    <<: *student
    container_name: pcbk-student-04
    networks: {pcbk-stu-04: {ipv4_address: "${STU_NET:-172.31}.4.3"}}
    extra_hosts: ["core:${STU_NET:-172.31}.4.2"]
    volumes:
      - pcbk-student-04-state:/var/lib/opencode
      - pcbk-student-04-work:/work
      - {type: bind, source: "${AGENTS_DIR:?AGENTS_DIR не задан}/student-04", target: /etc/pcbk-opencode/opencode/agents,
         read_only: true, bind: {create_host_path: false}}
    secrets:
      - {source: student-04-pw, target: opencode-pw}
      - {source: student-04-llm, target: llm-token}

  student-05:
    <<: *student
    container_name: pcbk-student-05
    networks: {pcbk-stu-05: {ipv4_address: "${STU_NET:-172.31}.5.3"}}
    extra_hosts: ["core:${STU_NET:-172.31}.5.2"]
    volumes:
      - pcbk-student-05-state:/var/lib/opencode
      - pcbk-student-05-work:/work
      - {type: bind, source: "${AGENTS_DIR:?AGENTS_DIR не задан}/student-05", target: /etc/pcbk-opencode/opencode/agents,
         read_only: true, bind: {create_host_path: false}}
    secrets:
      - {source: student-05-pw, target: opencode-pw}
      - {source: student-05-llm, target: llm-token}

  student-06:
    <<: *student
    container_name: pcbk-student-06
    networks: {pcbk-stu-06: {ipv4_address: "${STU_NET:-172.31}.6.3"}}
    extra_hosts: ["core:${STU_NET:-172.31}.6.2"]
    volumes:
      - pcbk-student-06-state:/var/lib/opencode
      - pcbk-student-06-work:/work
      - {type: bind, source: "${AGENTS_DIR:?AGENTS_DIR не задан}/student-06", target: /etc/pcbk-opencode/opencode/agents,
         read_only: true, bind: {create_host_path: false}}
    secrets:
      - {source: student-06-pw, target: opencode-pw}
      - {source: student-06-llm, target: llm-token}

  student-07:
    <<: *student
    container_name: pcbk-student-07
    networks: {pcbk-stu-07: {ipv4_address: "${STU_NET:-172.31}.7.3"}}
    extra_hosts: ["core:${STU_NET:-172.31}.7.2"]
    volumes:
      - pcbk-student-07-state:/var/lib/opencode
      - pcbk-student-07-work:/work
      - {type: bind, source: "${AGENTS_DIR:?AGENTS_DIR не задан}/student-07", target: /etc/pcbk-opencode/opencode/agents,
