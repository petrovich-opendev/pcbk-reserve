      pcbk-stu-07: {ipv4_address: "${STU_NET:-172.31}.7.2"}
      pcbk-stu-08: {ipv4_address: "${STU_NET:-172.31}.8.2"}
      pcbk-stu-09: {ipv4_address: "${STU_NET:-172.31}.9.2"}
      pcbk-stu-10: {ipv4_address: "${STU_NET:-172.31}.10.2"}
      pcbk-stu-11: {ipv4_address: "${STU_NET:-172.31}.11.2"}

  # Рабочие места 01…11 (Д2, место 11 — Д15б): только своя сеть (место .3, серверный слой .2 через
  # extra_hosts — под gVisor DNS Docker не работает), свои тома, агенты и секреты (пароль OpenCode, токены
  # LLM и данных — Д4б); портов нет.
  # Блоки 02–11 — копия 01 с точностью до номера (тест test_student_hardening).
  student-01:
    <<: *student
    container_name: pcbk-student-01
    networks: {pcbk-stu-01: {ipv4_address: "${STU_NET:-172.31}.1.3"}}
    extra_hosts: ["core:${STU_NET:-172.31}.1.2"]
    volumes:
      - pcbk-student-01-state:/var/lib/opencode
      - pcbk-student-01-work:/work
      # Подготовленные V1/V2 для обычного чата (Д22): только каталог chat/, не весь корпус; только чтение.
      - "${KDM1_CHAT_KNOWLEDGE_DIR:-pcbk-analytics-empty}:/work/kdm1-knowledge:ro"
      - {type: bind, source: "${AGENTS_DIR:?AGENTS_DIR не задан}/student-01", target: /etc/pcbk-opencode/opencode/agents,
