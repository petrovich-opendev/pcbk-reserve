volumes:
  # журнал переходов сторожа (SQLite); имя — с префиксом проекта, тестовый
  # проект pcbk-test не может удалить журнал выкладки
  pcbk-watchdog-journal:
  # журнал событий серверного слоя (core.db) — так же с префиксом проекта: тестовый проект
  # pcbk-test том выкладки не тронет
  pcbk-core-data:
  # временные файлы edge (Д5б): только тела и ответы в пути, данных нет — с префиксом проекта, как журналы
  pcbk-edge-temp:
  # пустой корпус аналитики КДМ-1 по умолчанию (Task 9): ANALYTICS_CORPUS_DIR не задан — аналитика выключена,
  # core монтирует этот пустой том вместо каталога хоста
  pcbk-analytics-empty:
  # данные студентов: внешние — Compose их не создаёт и не удаляет (down -v их не тронет)
  pcbk-student-01-state: {name: pcbk-student-01-state, external: true}
